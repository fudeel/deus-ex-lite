[package]
name = "deusmobile"
version = "0.1.0"
edition = "2021"
description = "DEUSMOBILE - a co-op stealth/action immersive sim"

[dependencies]
bevy = { version = "=0.16.1", features = ["wav"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
